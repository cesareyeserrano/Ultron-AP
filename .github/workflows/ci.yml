name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test (race detector)
        run: go test -race -count=1 ./...

      - name: Build (linux/arm64 — production target)
        run: GOOS=linux GOARCH=arm64 go build ./...

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # ubuntu-latest ships Chrome, but its location is not guaranteed to be on
      # PATH under a name chromedp looks for, so the path is passed explicitly.
      # The harness reads ULTRON_E2E_CHROME and falls back to its own lookup.
      - name: Locate Chrome
        run: |
          for c in google-chrome chromium-browser chromium; do
            p=$(command -v "$c" || true)
            if [ -n "$p" ]; then echo "ULTRON_E2E_CHROME=$p" >> "$GITHUB_ENV"; exit 0; fi
          done
          echo "no Chrome on the runner — installing chromium"
          sudo apt-get update -qq && sudo apt-get install -y -qq chromium-browser
          echo "ULTRON_E2E_CHROME=$(command -v chromium-browser)" >> "$GITHUB_ENV"

      # Behind the `e2e` build tag: these need a real browser, so a machine
      # without one must not fail the default suite. They cover the acceptance
      # criteria no HTTP-level test can observe — box positions, computed styles
      # mid-animation, behaviour with JavaScript switched off, console errors.
      # -count=1 is not optional: without it Go replays a cached result and the
      # browser tests silently do not run while the job reports success.
      - name: Browser tests
        run: go test -count=1 -tags e2e ./internal/server/ -run 'TestTC_HP|TestTC_SR|TestE2E' -v

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          # Soak mode: report findings (visible in the job log) without failing
          # the check. Drop this once the ~40 errcheck findings are cleaned up.
          args: --issues-exit-code=0
