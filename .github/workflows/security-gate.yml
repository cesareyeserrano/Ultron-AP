name: Security Gate

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run unit tests
        run: go test ./...

      # govulncheck exits 3 whenever anything is reachable, so it cannot by
      # itself distinguish "a new problem" from "the two Moby issues that have
      # no fix in any release". We scan as JSON and compare the reachable set
      # against .github/vuln-allowlist.txt instead.
      - name: Run govulncheck
        shell: bash
        run: |
          set +e
          govulncheck -format json ./... > govulncheck.json
          code=$?
          set -e
          # 0 = nothing reachable, 3 = findings exist (the next step judges them
          # against the allowlist). Any other code is a real tool failure — a bad
          # flag, a package that would not load — and must fail the job.
          if [ "$code" -ne 0 ] && [ "$code" -ne 3 ]; then
            echo "::error::govulncheck exited $code — that is a tool failure, not a findings result"
            exit "$code"
          fi
          echo "govulncheck exit=$code"

      - name: Enforce allowlist
        run: .github/scripts/check-vulns.sh govulncheck.json .github/vuln-allowlist.txt

      - name: Upload scan
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: govulncheck-scan
          path: govulncheck.json
          retention-days: 14

  posture:
    name: Audit posture re-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # scripts/security-gate.sh re-checks the findings of the 2026-07-14 audit:
      # no secret-like file tracked, no committed Telegram token, the helper's
      # unit-name allow-list still present, no new Sprintf-built SQL, no
      # .DS_Store inside a go:embed tree, and no Aitri trace ids in the client
      # JS that is served verbatim to browsers.
      #
      # It existed since that audit but ran nowhere — not in CI, not as an Aitri
      # quality gate — so nothing ever failed and two of its findings sat open
      # until 2026-09-06 (BG-079, BG-080). A check that runs nowhere is a
      # comment. Wiring it here is the actual fix.
      - name: Run security gate
        run: ./scripts/security-gate.sh
