{{define "content"}}
<div class="max-w-3xl mx-auto space-y-4">
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-lg font-semibold text-text">Pironman Integration</h1>
            <p class="text-xs text-text-muted mt-1">Optional module isolated from Ultron core lifecycle.</p>
        </div>
        <a href="/settings" class="px-3 py-1.5 text-xs bg-surface border border-border rounded text-text-muted hover:bg-card transition-colors">Back to settings</a>
    </div>

    <div class="bg-surface rounded-lg border border-border p-4">
        <form hx-post="/api/integrations/pironman/apply"
              hx-target="#pironman-form-container"
              hx-swap="innerHTML"
              hx-sync="this:drop">
            <div id="pironman-form-container">
                {{template "partials/pironman-form.html" .Content}}
            </div>
        </form>
    </div>
</div>
{{end}}
