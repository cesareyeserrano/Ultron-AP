<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} - Ultron-AP</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/css/app.css">
    <script src="/static/js/htmx.min.js"></script>
    {{if eq .ActivePage "dashboard"}}
    <script src="/static/js/sse.js"></script>
    {{end}}
</head>
<body class="bg-base text-text font-sans min-h-screen flex" hx-boost="true">
    <!-- Mobile overlay -->
    <div id="sidebar-overlay" class="hidden fixed inset-0 bg-black/50 z-30 md:hidden"></div>

    {{template "sidebar" .}}

    <div class="flex-1 flex flex-col min-w-0">
        {{template "header" .}}

        <main class="flex-1 p-4 md:p-6 overflow-y-auto">
            {{block "content" .}}{{end}}
        </main>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-3 pointer-events-none"></div>

    <script src="/static/js/sidebar.js"></script>
    <script>
    (function() {
        // Toast system
        window.showToast = function(message, type) {
            type = type || 'success';
            const container = document.getElementById('toast-container');
            if (!container) return;

            const toast = document.createElement('div');
            toast.className = 'px-4 py-3 rounded-lg shadow-xl border text-sm transition-all duration-300 translate-y-10 opacity-0 pointer-events-auto flex items-center gap-3 backdrop-blur-md';
            
            if (type === 'success') {
                toast.classList.add('bg-green-400/15', 'border-green-400/30', 'text-green-400');
                toast.innerHTML = '<svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg><span>' + message + '</span>';
            } else {
                toast.classList.add('bg-danger/15', 'border-danger/30', 'text-danger');
                toast.innerHTML = '<svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg><span>' + message + '</span>';
            }

            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-10', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        };

        document.body.addEventListener('showToast', function(e) {
            showToast(e.detail.message, e.detail.type);
        });

        var badge = document.getElementById('alert-badge');
        if (!badge) return;
        
        // Listen for alert-count events from the global SSE connection managed by HTMX
        document.body.addEventListener('htmx:sseMessage', function(e) {
            if (e.detail.type === 'alert-count') {
                var count = e.detail.data.trim();
                if (count && count !== '0') {
                    badge.textContent = count;
                    badge.classList.remove('hidden');
                } else {
                    badge.classList.add('hidden');
                }
            }
        });
    })();
    </script>
</body>
</html>
