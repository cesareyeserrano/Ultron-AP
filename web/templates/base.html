<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} - Ultron</title>
    <link rel="icon" type="image/png" sizes="64x64" href="/static/favicon-64.png?v={{.AssetVersion}}">
    <link rel="apple-touch-icon" href="/static/ultron-192.png?v={{.AssetVersion}}">
    <link rel="stylesheet" href="/static/css/app.css?v={{.AssetVersion}}">
    <script src="/static/js/htmx.min.js"></script>
    {{if eq .ActivePage "dashboard"}}
    <script src="/static/js/sse.js?v={{.AssetVersion}}"></script>
    {{end}}
    <!-- BG-038: widget scripts must load on every page so they survive hx-boost
         body-swaps to /settings (hx-boost doesn't update <head>). Each widget
         IIFE is idempotent (__*Bound guards) and binds htmx:afterSwap. -->
    <script src="/static/js/widgets/stepper.js?v={{.AssetVersion}}" defer></script>
    <script src="/static/js/widgets/segmented.js?v={{.AssetVersion}}" defer></script>
    <script src="/static/js/widgets/toggle.js?v={{.AssetVersion}}" defer></script>
    <script src="/static/js/widgets/chip-preset.js?v={{.AssetVersion}}" defer></script>
    <script src="/static/js/widgets/anchor-chip.js?v={{.AssetVersion}}" defer></script>
    <script src="/static/js/widgets/encryption-key.js?v={{.AssetVersion}}" defer></script>
    <!-- CSS7: settings page controller — same head-load + afterSwap re-init
         pattern as the widgets above; no-ops on pages without #settings-shell. -->
    <script src="/static/js/settings.js?v={{.AssetVersion}}" defer></script>
</head>
<body class="ux-shell bg-base text-text font-sans min-h-screen flex" hx-boost="true" data-active-page="{{.ActivePage}}">
    <!-- Mobile overlay -->
    <div id="sidebar-overlay" class="hidden fixed inset-0 bg-black/50 z-30 md:hidden"></div>

    {{template "sidebar" .}}

    <div class="flex-1 flex flex-col min-w-0">
        {{template "header" .}}

        <main class="flex-1 p-4 md:p-6 overflow-y-auto">
            {{block "content" .}}{{end}}
        </main>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-3 pointer-events-none"></div>

    <script src="/static/js/sidebar.js?v={{.AssetVersion}}"></script>
    <script>
    (function() {
        // Toast system
        window.showToast = function(message, type) {
            type = type || 'success';
            const container = document.getElementById('toast-container');
            if (!container) return;

            const toast = document.createElement('div');
            toast.className = 'px-4 py-3 rounded-lg shadow-xl border text-sm transition-all duration-300 translate-y-10 opacity-0 pointer-events-auto flex items-center gap-3 backdrop-blur-md';

            // CSS2: the message is server/attacker-influenced (it arrives via the
            // HX-Trigger showToast event, e.g. a container name or an error
            // string). Only the static SVG markup goes through innerHTML; the
            // message is set with textContent so it can never inject HTML/JS.
            const icon = document.createElement('span');
            icon.className = 'shrink-0 inline-flex';
            const text = document.createElement('span');
            text.textContent = message;

            if (type === 'success') {
                toast.classList.add('bg-green-400/15', 'border-green-400/30', 'text-green-400');
                icon.innerHTML = '<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>';
            } else {
                toast.classList.add('bg-danger/15', 'border-danger/30', 'text-danger');
                icon.innerHTML = '<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>';
            }
            toast.appendChild(icon);
            toast.appendChild(text);

            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-10', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        };

        document.body.addEventListener('showToast', function(e) {
            showToast(e.detail.message, e.detail.type);
        });

        var badge = document.getElementById('alert-badge');
        var badgeDot = document.getElementById('alert-badge-dot');
        if (!badge) return;

        function setSeenCount(count) {
            try { sessionStorage.setItem('ultron-alerts-seen', String(count)); } catch (e) {}
        }

        function getSeenCount() {
            try { return Number(sessionStorage.getItem('ultron-alerts-seen') || '0'); } catch (e) { return 0; }
        }

        function updateUnreadIndicator(count) {
            var activePage = document.body.getAttribute('data-active-page') || '';
            if (activePage === 'alerts') {
                setSeenCount(count);
                if (badgeDot) badgeDot.classList.add('hidden');
                return;
            }
            if (count > getSeenCount()) {
                if (badgeDot) badgeDot.classList.remove('hidden');
            }
        }

        function applyDefaultExpanded(root) {
            var scope = root || document;
            scope.querySelectorAll('details[data-default-open]').forEach(function(el) {
                if (!el.hasAttribute('open')) {
                    el.setAttribute('open', '');
                }
            });
        }

        function syncTimelineChips() {
            var chips = document.querySelectorAll('[data-timeline-chips] .timeline-chip[data-window]');
            if (!chips.length) return;
            var params = new URLSearchParams(window.location.search || '');
            var current = params.get('window') || '5m';
            chips.forEach(function(chip) {
                var isActive = chip.getAttribute('data-window') === current;
                chip.classList.toggle('timeline-chip-active', isActive);
                chip.classList.toggle('timeline-chip-idle', !isActive);
            });
        }

        function setFormBusy(form, isBusy) {
            form.querySelectorAll('button, input, select, textarea').forEach(function(el) {
                if (el.type === 'hidden') return;
                el.disabled = isBusy;
            });
        }

        function statusTargetFromForm(form) {
            var selector = form.getAttribute('data-status-target');
            if (!selector) return null;
            return document.querySelector(selector);
        }

        function setStatusMessage(form, html) {
            var target = statusTargetFromForm(form);
            if (!target) return;
            target.innerHTML = html;
        }

        function setAlertsFeedback(message, isError) {
            var box = document.getElementById('alerts-feedback');
            if (!box) return;
            if (!message) {
                box.textContent = '';
                box.classList.add('hidden');
                return;
            }
            box.textContent = message;
            box.classList.remove('hidden');
            box.classList.toggle('border-danger/40', !!isError);
            box.classList.toggle('bg-danger/10', !!isError);
            box.classList.toggle('text-danger', !!isError);
            box.classList.toggle('border-border/50', !isError);
            box.classList.toggle('bg-card/40', !isError);
            box.classList.toggle('text-text-muted', !isError);
        }

        applyDefaultExpanded(document);
        syncTimelineChips();

        document.body.addEventListener('htmx:afterSwap', function(e) {
            applyDefaultExpanded(e.target || document);
            syncTimelineChips();
            if (e.detail && e.detail.target && e.detail.target.id === 'alerts-list') {
                setAlertsFeedback('', false);
            }
        });

        document.body.addEventListener('htmx:beforeRequest', function(e) {
            var trigger = e.detail && e.detail.elt;
            var form = trigger && trigger.closest ? trigger.closest('form') : null;
            if (form && form.hasAttribute('data-status-target')) {
                var savingLabel = form.getAttribute('data-saving-label') || 'Saving...';
                setFormBusy(form, true);
                setStatusMessage(form, '<div class="text-xs text-text-muted py-2">' + savingLabel + '</div>');
            }
            var target = e.detail && e.detail.target;
            if (target && target.id === 'alerts-list') {
                setAlertsFeedback('Updating alerts...', false);
            }
        });

        document.body.addEventListener('htmx:afterRequest', function(e) {
            var trigger = e.detail && e.detail.elt;
            var form = trigger && trigger.closest ? trigger.closest('form') : null;
            if (!form || !form.hasAttribute('data-status-target')) return;

            setFormBusy(form, false);
            if (!e.detail.successful) {
                setStatusMessage(form, '<div class="text-xs text-danger py-2">Request failed. Verify values and retry.</div>');
            }
        });

        document.body.addEventListener('htmx:responseError', function(e) {
            var target = e.detail && e.detail.target;
            if (target && target.id === 'alerts-list') {
                setAlertsFeedback('Unable to refresh alerts right now. Retry in a few seconds.', true);
            }
        });
        
        // Listen for alert-count events from the global SSE connection managed by HTMX
        document.body.addEventListener('htmx:sseMessage', function(e) {
            if (e.detail.type === 'alert-count') {
                var count = e.detail.data.trim();
                if (count && count !== '0') {
                    var numeric = Number(count) || 0;
                    badge.textContent = count;
                    badge.classList.remove('hidden');
                    updateUnreadIndicator(numeric);
                } else {
                    badge.classList.add('hidden');
                    if (badgeDot) badgeDot.classList.add('hidden');
                    setSeenCount(0);
                }
            }
        });
    })();
    </script>
</body>
</html>
