<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} - Ultron-AP</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/css/app.css">
    <script src="/static/js/htmx.min.js"></script>
    <script src="/static/js/sse.js"></script>
</head>
<body class="bg-base text-text font-sans min-h-screen flex" hx-boost="true">
    <!-- Mobile overlay -->
    <div id="sidebar-overlay" class="hidden fixed inset-0 bg-black/50 z-30 md:hidden"></div>

    {{template "sidebar" .}}

    <div class="flex-1 flex flex-col min-w-0">
        {{template "header" .}}

        <main class="flex-1 p-4 md:p-6 overflow-y-auto">
            {{block "content" .}}{{end}}
        </main>
    </div>

    <script src="/static/js/sidebar.js"></script>
    <script>
    (function() {
        var badge = document.getElementById('alert-badge');
        if (!badge) return;
        var es = new EventSource('/api/sse/dashboard');
        es.addEventListener('alert-count', function(e) {
            var count = e.data.trim();
            if (count && count !== '0') {
                badge.textContent = count;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        });
    })();
    </script>
</body>
</html>
