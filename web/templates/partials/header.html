{{define "header"}}
<header class="flex items-center justify-between h-14 px-4 bg-surface border-b border-border shrink-0">
    <!-- Left: hamburger (mobile) + page title -->
    <div class="flex items-center gap-3">
        <button id="hamburger-btn" class="md:hidden p-1.5 rounded-lg text-text-muted hover:bg-card hover:text-text transition-colors">
            <!-- Lucide: Menu -->
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/>
            </svg>
        </button>
        <h1 class="text-lg font-semibold text-text">{{.Title}}</h1>
    </div>

    <!-- Right: uptime + user + power + logout -->
    <div class="flex items-center gap-3">
        <!-- Uptime indicator -->
        <div class="hidden sm:flex items-center gap-1.5 text-xs text-text-muted" title="Server uptime">
            <!-- Lucide: Clock -->
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
            </svg>
            <span class="font-mono">{{.Uptime}}</span>
        </div>

        <!-- Username -->
        <span class="hidden sm:block text-sm text-text-muted max-w-[120px] truncate">{{.Username}}</span>

        <!-- Restart button -->
        <button onclick="document.getElementById('modal-restart').classList.remove('hidden')"
            class="p-1.5 rounded-lg text-text-muted hover:bg-card hover:text-text transition-colors" title="Restart Pi">
            <!-- Lucide: RotateCcw -->
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>
            </svg>
        </button>

        <!-- Shutdown button -->
        <button onclick="document.getElementById('modal-shutdown').classList.remove('hidden')"
            class="p-1.5 rounded-lg text-text-muted hover:bg-danger hover:text-white transition-colors" title="Shutdown Pi">
            <!-- Lucide: Power -->
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.77.04"/>
            </svg>
        </button>

        <!-- Logout -->
        <form method="POST" action="/logout">
            <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
            <button type="submit" class="flex items-center gap-1.5 px-3 py-1.5 text-sm rounded-lg text-text-muted hover:bg-danger hover:text-white transition-colors" title="Logout">
                <!-- Lucide: LogOut -->
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/>
                </svg>
                <span class="hidden sm:inline">Logout</span>
            </button>
        </form>
    </div>
</header>

<!-- Restart Modal -->
<div id="modal-restart" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/60">
    <div class="bg-surface border border-border rounded-xl shadow-xl p-6 w-full max-w-sm mx-4">
        <h3 class="text-base font-semibold text-text mb-2">Restart Raspberry Pi?</h3>
        <p class="text-sm text-text-muted mb-5">The device will reboot. This will take about a minute.</p>
        <div class="flex gap-3 justify-end">
            <button onclick="document.getElementById('modal-restart').classList.add('hidden')"
                class="px-4 py-2 rounded-lg text-sm text-text-muted hover:bg-card transition-colors">
                Cancel
            </button>
            <button id="restart-btn"
                hx-post="/api/system/restart"
                hx-target="#restart-result"
                hx-swap="innerHTML"
                hx-vals='{"csrf_token": "{{.CSRFToken}}"}'
                onclick="this.disabled=true; this.textContent='Restarting...'"
                class="px-4 py-2 rounded-lg bg-accent text-white text-sm font-medium hover:bg-accent/80 transition-colors">
                Restart
            </button>
        </div>
        <div id="restart-result" class="mt-3 text-right"></div>
    </div>
</div>

<!-- Shutdown Modal -->
<div id="modal-shutdown" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/60">
    <div class="bg-surface border border-border rounded-xl shadow-xl p-6 w-full max-w-sm mx-4">
        <h3 class="text-base font-semibold text-danger mb-2">Shutdown Raspberry Pi?</h3>
        <p class="text-sm text-text-muted mb-4">This will power off the device. You will need physical access to turn it back on.</p>
        <p class="text-xs text-text-muted mb-2">Type <span class="font-mono text-text">shutdown</span> to confirm:</p>
        <input id="shutdown-confirm-input" type="text" autocomplete="off"
            oninput="document.getElementById('shutdown-btn').disabled = this.value !== 'shutdown'"
            class="w-full bg-card border border-border rounded-lg px-3 py-2 text-sm text-text focus:outline-none focus:border-danger mb-4"
            placeholder="shutdown">
        <div class="flex gap-3 justify-end">
            <button onclick="document.getElementById('modal-shutdown').classList.add('hidden'); document.getElementById('shutdown-confirm-input').value=''; document.getElementById('shutdown-btn').disabled=true"
                class="px-4 py-2 rounded-lg text-sm text-text-muted hover:bg-card transition-colors">
                Cancel
            </button>
            <button id="shutdown-btn" disabled
                hx-post="/api/system/shutdown"
                hx-target="#shutdown-result"
                hx-swap="innerHTML"
                hx-vals='{"csrf_token": "{{.CSRFToken}}", "confirm": "shutdown"}'
                onclick="this.disabled=true; this.textContent='Shutting down...'"
                class="px-4 py-2 rounded-lg bg-danger text-white text-sm font-medium hover:bg-danger/80 transition-colors disabled:opacity-40 disabled:cursor-not-allowed">
                Shutdown
            </button>
        </div>
        <div id="shutdown-result" class="mt-3 text-right"></div>
    </div>
</div>
{{end}}
