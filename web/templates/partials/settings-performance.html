{{define "settings-performance"}}            <section id="settings-performance" data-settings-section data-section="performance" class="panel-soft panel-glow p-4 md:p-5 space-y-3 border border-border/40">
                <div class="flex items-center justify-between gap-2">
                    <div class="flex items-center gap-2">
                        <h3 class="text-sm md:text-[1rem] font-semibold text-text">Performance</h3>
                    </div>
                    <span data-form-state-host="performance"></span>
                </div>
                <form hx-post="/api/performance" hx-target="#perf-status" hx-swap="innerHTML" data-status-target="#perf-status" data-saving-label="Applying performance profile..." data-settings-form="performance" class="space-y-3">
                    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
                    <!-- FR-057, FR-060: stepper widgets with inline range hint from RangeFor() -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        <div>
                            <label class="text-[11px] text-text-muted">{{rangeLabel "sse_interval_sec"}}</label>
                            <span data-widget="stepper" data-field="sse_interval_sec" data-min="{{rangeMin "sse_interval_sec"}}" data-max="{{rangeMax "sse_interval_sec"}}" data-value="{{.Content.Perf.SSEIntervalSec}}" class="mt-1 inline-flex items-center gap-1 w-full">
                                <button type="button" data-step="-1" class="min-w-[44px] min-h-[44px] px-2 text-sm bg-base border border-border rounded-lg text-text hover:bg-card">−</button>
                                <input type="number" name="sse_interval_sec" value="{{.Content.Perf.SSEIntervalSec}}" min="{{rangeMin "sse_interval_sec"}}" max="{{rangeMax "sse_interval_sec"}}" class="w-full px-2 py-2 text-sm bg-base border border-border rounded-lg text-text text-center tabular-nums focus:outline-none focus:border-accent">
                                <button type="button" data-step="1" class="min-w-[44px] min-h-[44px] px-2 text-sm bg-base border border-border rounded-lg text-text hover:bg-card">+</button>
                            </span>
                        </div>
                        <div>
                            <label class="text-[11px] text-text-muted">{{rangeLabel "disk_interval_min"}}</label>
                            <span data-widget="stepper" data-field="disk_interval_min" data-min="{{rangeMin "disk_interval_min"}}" data-max="{{rangeMax "disk_interval_min"}}" data-value="{{.Content.Perf.DiskIntervalMin}}" class="mt-1 inline-flex items-center gap-1 w-full">
                                <button type="button" data-step="-1" class="min-w-[44px] min-h-[44px] px-2 text-sm bg-base border border-border rounded-lg text-text hover:bg-card">−</button>
                                <input type="number" name="disk_interval_min" value="{{.Content.Perf.DiskIntervalMin}}" min="{{rangeMin "disk_interval_min"}}" max="{{rangeMax "disk_interval_min"}}" class="w-full px-2 py-2 text-sm bg-base border border-border rounded-lg text-text text-center tabular-nums focus:outline-none focus:border-accent">
                                <button type="button" data-step="1" class="min-w-[44px] min-h-[44px] px-2 text-sm bg-base border border-border rounded-lg text-text hover:bg-card">+</button>
                            </span>
                        </div>
                        <div>
                            <label class="text-[11px] text-text-muted">{{rangeLabel "docker_interval_sec"}}</label>
                            <span data-widget="stepper" data-field="docker_interval_sec" data-min="{{rangeMin "docker_interval_sec"}}" data-max="{{rangeMax "docker_interval_sec"}}" data-value="{{.Content.Perf.DockerIntervalSec}}" class="mt-1 inline-flex items-center gap-1 w-full">
                                <button type="button" data-step="-1" class="min-w-[44px] min-h-[44px] px-2 text-sm bg-base border border-border rounded-lg text-text hover:bg-card">−</button>
                                <input type="number" name="docker_interval_sec" value="{{.Content.Perf.DockerIntervalSec}}" min="{{rangeMin "docker_interval_sec"}}" max="{{rangeMax "docker_interval_sec"}}" class="w-full px-2 py-2 text-sm bg-base border border-border rounded-lg text-text text-center tabular-nums focus:outline-none focus:border-accent">
                                <button type="button" data-step="1" class="min-w-[44px] min-h-[44px] px-2 text-sm bg-base border border-border rounded-lg text-text hover:bg-card">+</button>
                            </span>
                        </div>
                        <div>
                            <label class="text-[11px] text-text-muted">{{rangeLabel "systemd_interval_sec"}}</label>
                            <span data-widget="stepper" data-field="systemd_interval_sec" data-min="{{rangeMin "systemd_interval_sec"}}" data-max="{{rangeMax "systemd_interval_sec"}}" data-value="{{.Content.Perf.SystemdIntervalSec}}" class="mt-1 inline-flex items-center gap-1 w-full">
                                <button type="button" data-step="-1" class="min-w-[44px] min-h-[44px] px-2 text-sm bg-base border border-border rounded-lg text-text hover:bg-card">−</button>
                                <input type="number" name="systemd_interval_sec" value="{{.Content.Perf.SystemdIntervalSec}}" min="{{rangeMin "systemd_interval_sec"}}" max="{{rangeMax "systemd_interval_sec"}}" class="w-full px-2 py-2 text-sm bg-base border border-border rounded-lg text-text text-center tabular-nums focus:outline-none focus:border-accent">
                                <button type="button" data-step="1" class="min-w-[44px] min-h-[44px] px-2 text-sm bg-base border border-border rounded-lg text-text hover:bg-card">+</button>
                            </span>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <button type="submit" data-primary-save class="px-3 py-1.5 text-xs bg-accent text-base rounded hover:opacity-90 transition-opacity">Save</button>
                        <button type="button" data-form-reset class="hidden px-3 py-1.5 text-xs border border-border text-text-muted rounded hover:bg-card transition-colors">Revert</button>
                    </div>
                    <div id="perf-status" class="min-h-[2rem]" aria-live="polite"></div>
                </form>
            </section>{{end}}
