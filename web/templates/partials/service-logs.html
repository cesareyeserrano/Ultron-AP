{{define "partials/service-logs.html"}}
{{if .Error}}
<div class="rounded-lg border border-danger/40 bg-danger/10 p-3">
    <p class="text-xs text-danger">{{.Error}}</p>
</div>
{{else if .Content}}
<div class="rounded-lg border border-border/40 bg-surface p-3">
    <div class="flex items-center justify-between gap-2 mb-2">
        <p class="text-[11px] text-text-muted">Last 100 journal lines — <span class="font-mono">{{.Name}}</span></p>
    </div>
    <pre data-service-log class="text-xs font-mono text-text whitespace-pre-wrap max-h-96 overflow-y-auto">{{.Content}}</pre>
</div>
{{else}}
<div class="rounded-lg border border-border/40 bg-card/25 p-3">
    <p class="text-xs text-text-muted">No log entries for this unit.</p>
</div>
{{end}}
{{end}}
