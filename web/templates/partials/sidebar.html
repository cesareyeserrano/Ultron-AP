{{define "sidebar"}}
<aside id="sidebar" class="sidebar-hidden md:sidebar-expanded flex flex-col bg-surface border-r border-border w-64 min-h-screen fixed md:sticky top-0 z-40 transition-all duration-200 overflow-hidden
  [&.sidebar-collapsed]:w-16
  [&.sidebar-hidden]:-translate-x-full [&.sidebar-hidden]:absolute
  md:[&.sidebar-hidden]:translate-x-0 md:[&.sidebar-hidden]:relative md:[&.sidebar-hidden]:w-64">

    <!-- Logo -->
    <div class="flex flex-col items-center justify-center px-3 py-4 border-b border-border shrink-0">
        <img src="/static/ultron-192.png?v=20260226h" alt="Ultron" class="shrink-0 mb-2" style="width:70px;height:70px;">
        <span class="sidebar-label text-sm font-semibold text-text text-center leading-tight">Ultron</span>
        <span class="sidebar-label text-[11px] text-text-muted text-center leading-tight inline-flex items-center gap-1">
            <span>Rasberry PI</span>
            <svg class="w-3 h-3" viewBox="0 0 407 512" aria-hidden="true" fill="currentColor"><path d="M372 232.5l-3.7-6.5c.1-46.4-21.4-65.3-46.5-79.7 7.6-2 15.4-3.6 17.6-13.2 13.1-3.3 15.8-9.4 17.1-15.8 3.4-2.3 14.8-8.7 13.6-19.7 6.4-4.4 10-10.1 8.1-18.1 6.9-7.5 8.7-13.7 5.8-19.4 8.3-10.3 4.6-15.6 1.1-20.9 6.2-11.2.7-23.2-16.6-21.2-6.9-10.1-21.9-7.8-24.2-7.8-2.6-3.2-6-6-16.5-4.7-6.8-6.1-14.4-5-22.3-2.1-9.3-7.3-15.5-1.4-22.6.8C271.6.6 269 5.5 263.5 7.6c-12.3-2.6-16.1 3-22 8.9l-6.9-.1c-18.6 10.8-27.8 32.8-31.1 44.1-3.3-11.3-12.5-33.3-31.1-44.1l-6.9.1c-5.9-5.9-9.7-11.5-22-8.9-5.6-2-8.1-7-19.4-3.4-4.6-1.4-8.9-4.4-13.9-4.3-2.6.1-5.5 1-8.7 3.5-7.9-3-15.5-4-22.3 2.1-10.5-1.3-14 1.4-16.5 4.7-2.3 0-17.3-2.3-24.2 7.8C21.2 16 15.8 28 22 39.2c-3.5 5.4-7.2 10.7 1.1 20.9-2.9 5.7-1.1 11.9 5.8 19.4-1.8 8 1.8 13.7 8.1 18.1-1.2 11 10.2 17.4 13.6 19.7 1.3 6.4 4 12.4 17.1 15.8 2.2 9.5 10 11.2 17.6 13.2-25.1 14.4-46.6 33.3-46.5 79.7l-3.7 6.5c-28.8 17.2-54.7 72.7-14.2 117.7 2.6 14.1 7.1 24.2 11 35.4 5.9 45.2 44.5 66.3 54.6 68.8 14.9 11.2 30.8 21.8 52.2 29.2C159 504.2 181 512 203 512h1c22.1 0 44-7.8 64.2-28.4 21.5-7.4 37.3-18 52.2-29.2 10.2-2.5 48.7-23.6 54.6-68.8 3.9-11.2 8.4-21.3 11-35.4 40.6-45.1 14.7-100.5-14-117.7z"/></svg>
            <span>Dashboard.</span>
        </span>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 py-2 overflow-y-auto">
        <ul class="space-y-1 px-2">
            <li>
                <a href="/" class="nav-item group flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition-colors
                    {{if eq .ActivePage "dashboard"}}bg-card text-accent{{else}}text-text-muted hover:bg-card hover:text-text{{end}}" hx-boost="true">
                    <!-- Lucide: LayoutDashboard -->
                    <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/>
                    </svg>
                    <span class="whitespace-nowrap truncate sidebar-label">Dashboard</span>
                </a>
            </li>
            <li>
                <a href="/docker" class="nav-item group flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition-colors
                    {{if eq .ActivePage "docker"}}bg-card text-accent{{else}}text-text-muted hover:bg-card hover:text-text{{end}}" hx-boost="true">
                    <!-- Lucide: Container -->
                    <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect width="18" height="14" x="3" y="5" rx="2"/><path d="M7 5V3"/><path d="M17 5V3"/><path d="M3 12h18"/>
                    </svg>
                    <span class="whitespace-nowrap truncate sidebar-label">Docker</span>
                </a>
            </li>
            <li>
                <a href="/services" class="nav-item group flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition-colors
                    {{if eq .ActivePage "services"}}bg-card text-accent{{else}}text-text-muted hover:bg-card hover:text-text{{end}}" hx-boost="true">
                    <!-- Lucide: Server -->
                    <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect width="20" height="8" x="2" y="2" rx="2" ry="2"/><rect width="20" height="8" x="2" y="14" rx="2" ry="2"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/>
                    </svg>
                    <span class="whitespace-nowrap truncate sidebar-label">Services</span>
                </a>
            </li>
            <li>
                <a href="/alerts" class="nav-item group flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition-colors
                    {{if eq .ActivePage "alerts"}}bg-card text-accent{{else}}text-text-muted hover:bg-card hover:text-text{{end}}" hx-boost="true">
                    <!-- Lucide: Bell -->
                    <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
                    </svg>
                    <span class="whitespace-nowrap truncate sidebar-label">Alerts</span>
                    <span id="alert-badge" class="hidden ml-auto text-xs bg-danger text-white px-1.5 py-0.5 rounded-full font-medium sidebar-label"></span>
                </a>
            </li>
            <li>
                <a href="/history" class="nav-item group flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition-colors
                    {{if eq .ActivePage "history"}}bg-card text-accent{{else}}text-text-muted hover:bg-card hover:text-text{{end}}" hx-boost="true">
                    <!-- Lucide: ClipboardList -->
                    <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/>
                    </svg>
                    <span class="whitespace-nowrap truncate sidebar-label">History</span>
                </a>
            </li>
            <li>
                <a href="/logs" class="nav-item group flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition-colors
                    {{if eq .ActivePage "logs"}}bg-card text-accent{{else}}text-text-muted hover:bg-card hover:text-text{{end}}" hx-boost="true">
                    <!-- Lucide: Terminal -->
                    <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/>
                    </svg>
                    <span class="whitespace-nowrap truncate sidebar-label">Logs</span>
                </a>
            </li>
            <li>
                <a href="/settings" class="nav-item group flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition-colors
                    {{if eq .ActivePage "settings"}}bg-card text-accent{{else}}text-text-muted hover:bg-card hover:text-text{{end}}" hx-boost="true">
                    <!-- Lucide: Settings -->
                    <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                    <span class="whitespace-nowrap truncate sidebar-label">Settings</span>
                </a>
            </li>
        </ul>
    </nav>

    <!-- Collapse toggle (hidden on mobile) -->
    <div class="hidden md:flex items-center justify-center border-t border-border p-2">
        <button id="sidebar-toggle" class="p-2 rounded-lg text-text-muted hover:bg-card hover:text-text transition-colors" title="Toggle sidebar">
            <!-- Lucide: PanelLeftClose / PanelLeftOpen -->
            <svg class="w-5 h-5 sidebar-expanded-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/><path d="m16 15-3-3 3-3"/>
            </svg>
            <svg class="w-5 h-5 sidebar-collapsed-icon hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/><path d="m14 9 3 3-3 3"/>
            </svg>
        </button>
    </div>
</aside>
{{end}}
