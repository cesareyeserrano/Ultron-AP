{{define "sidebar"}}
<aside id="sidebar" class="sidebar-hidden md:sidebar-expanded sidebar-surface flex flex-col border-r border-border w-64 min-h-screen fixed md:sticky top-0 z-40 transition-all duration-200 overflow-hidden
  [&.sidebar-collapsed]:w-16
  [&.sidebar-hidden]:-translate-x-full [&.sidebar-hidden]:absolute
  md:[&.sidebar-hidden]:translate-x-0 md:[&.sidebar-hidden]:relative md:[&.sidebar-hidden]:w-64">

    <!-- Logo -->
    <div class="sidebar-brand flex flex-col items-center justify-center px-3 py-4 border-b border-border shrink-0">
        <img src="/static/ultron-192.png?v={{.AssetVersion}}" alt="Ultron" class="shrink-0 mb-2 w-[76px] h-[76px]">
        <span class="sidebar-label text-sm font-semibold text-text text-center leading-tight tracking-wide">ULTRON</span>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 py-2 overflow-y-auto">
        <ul class="space-y-1 px-2">
            <li>
                <a href="/" class="nav-item nav-item-dashboard group flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition-colors
                    {{if eq .ActivePage "dashboard"}}active-link bg-card text-accent border border-accent/30{{else}}text-text-muted hover:bg-card hover:text-text border border-transparent{{end}}" hx-boost="true">
                    <!-- Lucide: LayoutDashboard -->
                    <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/>
                    </svg>
                    <span class="whitespace-nowrap truncate sidebar-label">Dashboard</span>
                </a>
            </li>
            <li>
                <a href="/docker" class="nav-item group flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition-colors
                    {{if eq .ActivePage "docker"}}active-link bg-card text-accent border border-accent/30{{else}}text-text-muted hover:bg-card hover:text-text border border-transparent{{end}}" hx-boost="true">
                    <!-- Lucide: Container -->
                    <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect width="18" height="14" x="3" y="5" rx="2"/><path d="M7 5V3"/><path d="M17 5V3"/><path d="M3 12h18"/>
                    </svg>
                    <span class="whitespace-nowrap truncate sidebar-label">Docker</span>
                </a>
            </li>
            <li>
                <a href="/services" class="nav-item group flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition-colors
                    {{if eq .ActivePage "services"}}active-link bg-card text-accent border border-accent/30{{else}}text-text-muted hover:bg-card hover:text-text border border-transparent{{end}}" hx-boost="true">
                    <!-- Lucide: Server -->
                    <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect width="20" height="8" x="2" y="2" rx="2" ry="2"/><rect width="20" height="8" x="2" y="14" rx="2" ry="2"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/>
                    </svg>
                    <span class="whitespace-nowrap truncate sidebar-label">Services</span>
                </a>
            </li>
            <li>
                <a href="/alerts" class="nav-item group flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition-colors
                    {{if eq .ActivePage "alerts"}}active-link bg-card text-accent border border-accent/30{{else}}text-text-muted hover:bg-card hover:text-text border border-transparent{{end}}" hx-boost="true">
                    <!-- Lucide: Bell -->
                    <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
                    </svg>
                    <span class="whitespace-nowrap truncate sidebar-label">Alerts</span>
                    <span id="alert-badge" class="hidden ml-auto text-xs bg-danger text-white px-1.5 py-0.5 rounded-full font-medium sidebar-label"></span>
                    <span id="alert-badge-dot" class="hidden w-2 h-2 rounded-full bg-danger ml-auto sidebar-label"></span>
                </a>
            </li>
            <li>
                <a href="/network" class="nav-item group flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition-colors
                    {{if eq .ActivePage "network"}}active-link bg-card text-accent border border-accent/30{{else}}text-text-muted hover:bg-card hover:text-text border border-transparent{{end}}" hx-boost="true">
                    <!-- Lucide: Activity -->
                    <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
                    </svg>
                    <span class="whitespace-nowrap truncate sidebar-label">Network</span>
                </a>
            </li>
            <li>
                <a href="/history" class="nav-item group flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition-colors
                    {{if eq .ActivePage "history"}}active-link bg-card text-accent border border-accent/30{{else}}text-text-muted hover:bg-card hover:text-text border border-transparent{{end}}" hx-boost="true">
                    <!-- Lucide: ClipboardList -->
                    <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/>
                    </svg>
                    <span class="whitespace-nowrap truncate sidebar-label">History</span>
                </a>
            </li>
            <li>
                <a href="/logs" class="nav-item group flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition-colors
                    {{if eq .ActivePage "logs"}}active-link bg-card text-accent border border-accent/30{{else}}text-text-muted hover:bg-card hover:text-text border border-transparent{{end}}" hx-boost="true">
                    <!-- Lucide: Terminal -->
                    <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/>
                    </svg>
                    <span class="whitespace-nowrap truncate sidebar-label">Logs</span>
                </a>
            </li>
            <li>
                <a href="/settings" class="nav-item group flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition-colors
                    {{if eq .ActivePage "settings"}}active-link bg-card text-accent border border-accent/30{{else}}text-text-muted hover:bg-card hover:text-text border border-transparent{{end}}" hx-boost="true">
                    <!-- Lucide: Settings -->
                    <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                    <span class="whitespace-nowrap truncate sidebar-label">Settings</span>
                </a>
            </li>
            <li>
                <a href="/help" class="nav-item nav-item-help group flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition-colors
                    {{if eq .ActivePage "help"}}active-link bg-card text-accent border border-accent/30{{else}}text-text-muted hover:bg-card hover:text-text border border-transparent{{end}}" hx-boost="true">
                    <!-- Lucide: HelpCircle -->
                    <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/>
                    </svg>
                    <span class="whitespace-nowrap truncate sidebar-label">Help</span>
                </a>
            </li>
        </ul>
    </nav>

    <div class="hidden md:flex items-center justify-center border-t border-border p-2">
        <button id="sidebar-toggle" class="inline-flex items-center gap-2 px-2 py-1.5 rounded-lg text-text-muted hover:bg-card hover:text-text transition-colors" title="Expand / collapse sidebar" aria-label="Expand or collapse sidebar">
            <svg class="w-4 h-4 sidebar-expanded-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/><path d="m16 15-3-3 3-3"/>
            </svg>
            <svg class="w-4 h-4 sidebar-collapsed-icon hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/><path d="m14 9 3 3-3 3"/>
            </svg>
        </button>
    </div>
</aside>
{{end}}
