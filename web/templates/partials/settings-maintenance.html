{{define "settings-maintenance"}}            <section id="settings-maintenance" data-settings-section data-section="maintenance" class="panel-soft panel-glow p-4 md:p-5 space-y-3 border border-border/40">
                <div class="flex items-center gap-2">
                    <h3 class="text-sm md:text-[1rem] font-semibold text-text">Maintenance</h3>
                </div>
                <div class="rounded-lg border border-border/40 bg-card/25 p-3 flex flex-col md:flex-row md:items-center md:justify-between gap-3">
                    <div>
                        <p class="text-xs text-text">Database backup export</p>
                        <p class="text-[11px] text-text-muted">Download snapshot or send backup to Telegram.</p>
                    </div>
                    <div class="flex flex-wrap gap-2">
                        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
                        <a href="/api/settings/backup" class="px-3 py-1.5 text-xs bg-surface border border-border text-text rounded hover:bg-card transition-colors">Download .db</a>
                        <button hx-post="/api/settings/backup/run" hx-swap="none" hx-include="next [name='csrf_token'], previous [name='csrf_token'], [name='csrf_token']" hx-indicator="#backup-spinner" class="px-3 py-1.5 text-xs bg-accent text-base rounded hover:opacity-90 transition-opacity inline-flex items-center gap-2">
                            <svg id="backup-spinner" class="w-3.5 h-3.5 animate-spin htmx-indicator" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
                            Backup & Send
                        </button>
                    </div>
                </div>
            </section>{{end}}
