{{define "settings-email"}}            <section id="settings-email" data-settings-section data-section="email" class="panel-soft panel-glow p-4 md:p-5 space-y-3 border border-border/40">
                <div class="flex items-center justify-between gap-2">
                    <div class="flex items-center gap-2">
                        <h3 class="text-sm md:text-[1rem] font-semibold text-text">Email</h3>
                    </div>
                    <span data-form-state-host="email"></span>
                </div>
                <form hx-post="/api/notifications/email" hx-target="#email-status" hx-swap="innerHTML" data-status-target="#email-status" data-saving-label="Saving email settings..." data-settings-form="email" class="space-y-3">
                    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-2">
                        <div>
                            <label class="text-[11px] text-text-muted">SMTP Host</label>
                            <input type="text" name="smtp_host" value="{{if .Content.Email}}{{index .Content.Email.Fields "smtp_host"}}{{end}}" class="w-full mt-1 px-2 py-1.5 text-sm bg-base border border-border rounded-lg text-text focus:outline-none focus:border-accent">
                        </div>
                        <div>
                            <label class="text-[11px] text-text-muted">SMTP Port</label>
                            <input type="text" name="smtp_port" value="{{if .Content.Email}}{{index .Content.Email.Fields "smtp_port"}}{{end}}" class="w-full mt-1 px-2 py-1.5 text-sm bg-base border border-border rounded-lg text-text focus:outline-none focus:border-accent">
                        </div>
                        <div>
                            <label class="text-[11px] text-text-muted">SMTP User</label>
                            <input type="text" name="smtp_user" value="{{if .Content.Email}}{{index .Content.Email.Fields "smtp_user"}}{{end}}" class="w-full mt-1 px-2 py-1.5 text-sm bg-base border border-border rounded-lg text-text focus:outline-none focus:border-accent">
                        </div>
                        <div>
                            <label class="text-[11px] text-text-muted">SMTP Password</label>
                            <input type="password" name="smtp_password" placeholder="{{if .Content.Email}}{{index .Content.Email.Fields "smtp_password"}}{{else}}Password{{end}}" class="w-full mt-1 px-2 py-1.5 text-sm bg-base border border-border rounded-lg text-text focus:outline-none focus:border-accent">
                        </div>
                        <div>
                            <label class="text-[11px] text-text-muted">From</label>
                            <input type="email" name="from" value="{{if .Content.Email}}{{index .Content.Email.Fields "from"}}{{end}}" class="w-full mt-1 px-2 py-1.5 text-sm bg-base border border-border rounded-lg text-text focus:outline-none focus:border-accent">
                        </div>
                        <div>
                            <label class="text-[11px] text-text-muted">To</label>
                            <input type="email" name="to" value="{{if .Content.Email}}{{index .Content.Email.Fields "to"}}{{end}}" class="w-full mt-1 px-2 py-1.5 text-sm bg-base border border-border rounded-lg text-text focus:outline-none focus:border-accent">
                        </div>
                    </div>
                    <!-- FR-080: daily digest — an email-channel setting, saved by this form. -->
                    <div id="email-digest" class="rounded-lg border border-border/40 bg-card/25 p-3 space-y-2">
                        <label data-widget="toggle" data-field="digest_enabled" data-state="{{if .Content.Digest.Enabled}}on{{else}}off{{end}}" class="flex items-center gap-2 text-xs text-text cursor-pointer min-h-[44px]">
                            <span data-toggle-track class="relative inline-block w-10 h-6 rounded-full bg-card border border-border transition-colors data-[state=on]:bg-accent/40 data-[state=on]:border-accent" data-state="{{if .Content.Digest.Enabled}}on{{else}}off{{end}}">
                                <span data-toggle-thumb class="absolute top-0.5 left-0.5 w-5 h-5 rounded-full bg-text-muted transition-all data-[state=on]:bg-accent data-[state=on]:left-[18px]" data-state="{{if .Content.Digest.Enabled}}on{{else}}off{{end}}"></span>
                            </span>
                            <input type="checkbox" name="digest_enabled" data-toggle-input {{if .Content.Digest.Enabled}}checked{{end}} class="sr-only" aria-label="Daily digest enabled">
                            <span data-toggle-label>Daily digest</span>
                        </label>
                        <div>
                            <label class="text-[11px] text-text-muted">Digest hour (0–23)</label>
                            <span data-widget="stepper" data-field="digest_hour" data-min="0" data-max="23" data-value="{{.Content.Digest.Hour}}" class="mt-1 inline-flex items-center gap-1">
                                <button type="button" data-step="-1" class="min-w-[44px] min-h-[44px] px-2 text-sm bg-base border border-border rounded-lg text-text hover:bg-card">−</button>
                                <input type="number" name="digest_hour" value="{{.Content.Digest.Hour}}" min="0" max="23" class="w-16 px-2 py-2 text-sm bg-base border border-border rounded-lg text-text text-center tabular-nums focus:outline-none focus:border-accent">
                                <button type="button" data-step="1" class="min-w-[44px] min-h-[44px] px-2 text-sm bg-base border border-border rounded-lg text-text hover:bg-card">+</button>
                            </span>
                        </div>
                        <p class="text-xs text-text-muted">One email a day summarising the last 24h of alerts. Per-alert emails keep sending as usual.</p>
                    </div>

                    <div class="flex flex-wrap items-center gap-2">
                        <!-- FR-061: toggle replaces checkbox -->
                        <label data-widget="toggle" data-field="email_enabled" data-state="{{if and .Content.Email .Content.Email.Enabled}}on{{else}}off{{end}}" class="flex items-center gap-2 text-xs text-text cursor-pointer min-h-[44px]">
                            <span data-toggle-track class="relative inline-block w-10 h-6 rounded-full bg-card border border-border transition-colors data-[state=on]:bg-accent/40 data-[state=on]:border-accent" data-state="{{if and .Content.Email .Content.Email.Enabled}}on{{else}}off{{end}}">
                                <span data-toggle-thumb class="absolute top-0.5 left-0.5 w-5 h-5 rounded-full bg-text-muted transition-all data-[state=on]:bg-accent data-[state=on]:left-[18px]" data-state="{{if and .Content.Email .Content.Email.Enabled}}on{{else}}off{{end}}"></span>
                            </span>
                            <input type="checkbox" name="enabled" data-toggle-input {{if and .Content.Email .Content.Email.Enabled}}checked{{end}} class="sr-only" aria-label="Email enabled">
                            <span data-toggle-label>{{if and .Content.Email .Content.Email.Enabled}}Enabled{{else}}Disabled{{end}}</span>
                        </label>
                        <button type="submit" data-primary-save class="px-3 py-1.5 text-xs bg-accent text-base rounded hover:opacity-90 transition-opacity">Save</button>
                        <button type="button" data-form-reset class="hidden px-3 py-1.5 text-xs border border-border text-text-muted rounded hover:bg-card transition-colors">Revert</button>
                        <button type="button" hx-post="/api/notifications/email/test" hx-target="#email-status" hx-include="[name='csrf_token']" data-settings-ignore-state="true" class="px-3 py-1.5 text-xs border border-border text-text-muted rounded hover:bg-card transition-colors">Test</button>
                    </div>
                    <div id="email-status" class="min-h-[2rem]" aria-live="polite"></div>
                </form>
            </section>{{end}}
