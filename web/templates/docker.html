{{define "content"}}
<div class="space-y-6">
    <h2 class="sr-only">Docker Containers</h2>
    <div class="flex flex-wrap items-center justify-between gap-2">
        <p class="text-sm text-text-muted">Container runtime status.</p>
    </div>

    <!-- Container List -->
    <div id="docker-list" hx-get="/docker" hx-trigger="every 10s" hx-select="#docker-list" hx-swap="outerHTML">
        {{template "partials/docker-list.html" .Content}}
    </div>
</div>
{{end}}
