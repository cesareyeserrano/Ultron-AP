{{define "content"}}
<div class="space-y-6 page-premium">
    <div class="page-head">
        <h1 class="page-title">Docker Containers</h1>
        {{if not .Content.Available}}
        <span class="page-status-badge page-status-danger">Docker unavailable</span>
        {{end}}
    </div>

    <!-- Hidden CSRF token for HTMX requests -->
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">

    <!-- Container List -->
    <div id="docker-list" class="panel-shell p-2">
        {{template "partials/docker-list.html" .Content.Containers}}
    </div>
</div>
{{end}}
