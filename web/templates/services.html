{{define "content"}}
<div class="space-y-6 page-premium">
    <div class="page-head">
        <h1 class="page-title">Systemd Services</h1>
        {{if not .Content.Available}}
        <span class="page-status-badge page-status-danger">systemctl unavailable</span>
        {{end}}
    </div>

    <!-- Hidden CSRF token for HTMX requests -->
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">

    <!-- Service List -->
    <div id="services-list" class="panel-shell p-2">
        {{template "partials/services-list.html" .Content.Services}}
    </div>
</div>
{{end}}
