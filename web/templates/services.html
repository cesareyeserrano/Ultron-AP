{{define "content"}}
<div class="space-y-6">
    <h2 class="sr-only">Systemd Services</h2>
    <div class="flex flex-wrap items-center justify-between gap-2">
        <p class="text-sm text-text-muted">Service health, runtime usage and control actions.</p>
        {{if not .Content.Available}}
        <span class="text-xs bg-danger/20 text-danger px-2 py-1 rounded-full">systemctl unavailable</span>
        {{end}}
    </div>

    <!-- Hidden CSRF token for HTMX requests -->
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">

    <!-- Service List -->
    <div id="services-list">
        {{template "partials/services-list.html" .Content}}
    </div>
</div>
{{end}}
