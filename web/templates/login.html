<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultron - Login</title>
    <link rel="icon" type="image/png" sizes="64x64" href="/static/favicon-64.png?v=20260226h">
    <link rel="apple-touch-icon" href="/static/ultron-192.png?v=20260226h">
    <link rel="stylesheet" href="/static/css/app.css?v=20260227ux3">
</head>
<body class="bg-base text-text font-sans flex justify-center items-center min-h-screen m-0">
    <div class="bg-surface p-8 rounded-lg w-full max-w-[360px] shadow-lg shadow-black/30">
        <div class="flex flex-col items-center justify-center mb-6">
            <img src="/static/ultron-192.png?v=20260226h" alt="ULTRON" class="shrink-0 mb-2" style="width:100px;height:100px;">
            <h1 class="text-xl font-bold text-danger leading-tight">ULTRON</h1>
            <p class="text-xs text-text-muted leading-tight">Raspberry Dashboard</p>
        </div>
        {{if .Error}}
        <div class="bg-error-bg text-error-text px-3 py-2 rounded mb-4 text-center text-sm">{{.Error}}</div>
        {{end}}
        <form method="POST" action="/login">
            <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
            <label for="username" class="block mb-1 text-sm text-text-muted">Username</label>
            <input type="text" id="username" name="username" autocomplete="username" required
                   class="w-full px-3 py-2 mb-4 bg-card border border-border rounded text-text text-base focus:outline-none focus:border-accent">
            <label for="password" class="block mb-1 text-sm text-text-muted">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required
                   class="w-full px-3 py-2 mb-4 bg-card border border-border rounded text-text text-base focus:outline-none focus:border-accent">
            <button type="submit"
                    class="w-full py-2.5 bg-danger text-white border-none rounded text-base cursor-pointer hover:bg-danger-hover transition-colors">
                Login
            </button>
        </form>
    </div>
</body>
</html>
