<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultron-AP - Login</title>
    <link rel="icon" type="image/svg+xml" href="/static/brand/ultron-mark-brand.svg">
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="bg-base text-text font-sans flex justify-center items-center min-h-screen m-0 ultron-premium">
    <div class="bg-surface p-8 rounded-lg w-full max-w-[360px] shadow-lg shadow-black/30">
        <div class="flex items-center justify-center gap-3 mb-6">
            <img src="/static/brand/ultron-mark-on-dark.svg" alt="Ultron" class="w-8 h-8 shrink-0">
            <h1 class="text-2xl font-bold text-text">Ultron-AP</h1>
        </div>
        {{if .Error}}
        <div class="bg-error-bg text-error-text px-3 py-2 rounded mb-4 text-center text-sm">{{.Error}}</div>
        {{end}}
        <form method="POST" action="/login">
            <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
            <label for="username" class="block mb-1 text-sm text-text-muted">Username</label>
            <input type="text" id="username" name="username" autocomplete="username" required
                   class="w-full px-3 py-2 mb-4 bg-card border border-border rounded text-text text-base focus:outline-none focus:border-accent">
            <label for="password" class="block mb-1 text-sm text-text-muted">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required
                   class="w-full px-3 py-2 mb-4 bg-card border border-border rounded text-text text-base focus:outline-none focus:border-accent">
            <button type="submit"
                    class="w-full py-2.5 bg-danger text-white border-none rounded text-base cursor-pointer hover:bg-danger-hover transition-colors">
                Login
            </button>
        </form>
    </div>
</body>
</html>
