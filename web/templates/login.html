<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultron - Login</title>
    <link rel="icon" type="image/png" sizes="64x64" href="/static/favicon-64.png?v=20260226h">
    <link rel="apple-touch-icon" href="/static/ultron-192.png?v=20260226h">
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="bg-base text-text font-sans flex justify-center items-center min-h-screen m-0">
    <div class="bg-surface p-8 rounded-lg w-full max-w-[360px] shadow-lg shadow-black/30">
        <div class="flex flex-col items-center justify-center mb-6">
            <img src="/static/ultron-192.png?v=20260226h" alt="Ultron" class="shrink-0 mb-2" style="width:70px;height:70px;">
            <h1 class="text-xl font-bold text-danger leading-tight">Ultron</h1>
            <p class="text-xs text-text-muted leading-tight inline-flex items-center gap-1">
                <span>Rasberry PI</span>
                <svg class="w-3 h-3" viewBox="0 0 407 512" aria-hidden="true" fill="currentColor"><path d="M372 232.5l-3.7-6.5c.1-46.4-21.4-65.3-46.5-79.7 7.6-2 15.4-3.6 17.6-13.2 13.1-3.3 15.8-9.4 17.1-15.8 3.4-2.3 14.8-8.7 13.6-19.7 6.4-4.4 10-10.1 8.1-18.1 6.9-7.5 8.7-13.7 5.8-19.4 8.3-10.3 4.6-15.6 1.1-20.9 6.2-11.2.7-23.2-16.6-21.2-6.9-10.1-21.9-7.8-24.2-7.8-2.6-3.2-6-6-16.5-4.7-6.8-6.1-14.4-5-22.3-2.1-9.3-7.3-15.5-1.4-22.6.8C271.6.6 269 5.5 263.5 7.6c-12.3-2.6-16.1 3-22 8.9l-6.9-.1c-18.6 10.8-27.8 32.8-31.1 44.1-3.3-11.3-12.5-33.3-31.1-44.1l-6.9.1c-5.9-5.9-9.7-11.5-22-8.9-5.6-2-8.1-7-19.4-3.4-4.6-1.4-8.9-4.4-13.9-4.3-2.6.1-5.5 1-8.7 3.5-7.9-3-15.5-4-22.3 2.1-10.5-1.3-14 1.4-16.5 4.7-2.3 0-17.3-2.3-24.2 7.8C21.2 16 15.8 28 22 39.2c-3.5 5.4-7.2 10.7 1.1 20.9-2.9 5.7-1.1 11.9 5.8 19.4-1.8 8 1.8 13.7 8.1 18.1-1.2 11 10.2 17.4 13.6 19.7 1.3 6.4 4 12.4 17.1 15.8 2.2 9.5 10 11.2 17.6 13.2-25.1 14.4-46.6 33.3-46.5 79.7l-3.7 6.5c-28.8 17.2-54.7 72.7-14.2 117.7 2.6 14.1 7.1 24.2 11 35.4 5.9 45.2 44.5 66.3 54.6 68.8 14.9 11.2 30.8 21.8 52.2 29.2C159 504.2 181 512 203 512h1c22.1 0 44-7.8 64.2-28.4 21.5-7.4 37.3-18 52.2-29.2 10.2-2.5 48.7-23.6 54.6-68.8 3.9-11.2 8.4-21.3 11-35.4 40.6-45.1 14.7-100.5-14-117.7z"/></svg>
                <span>Dashboard.</span>
            </p>
        </div>
        {{if .Error}}
        <div class="bg-error-bg text-error-text px-3 py-2 rounded mb-4 text-center text-sm">{{.Error}}</div>
        {{end}}
        <form method="POST" action="/login">
            <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
            <label for="username" class="block mb-1 text-sm text-text-muted">Username</label>
            <input type="text" id="username" name="username" autocomplete="username" required
                   class="w-full px-3 py-2 mb-4 bg-card border border-border rounded text-text text-base focus:outline-none focus:border-accent">
            <label for="password" class="block mb-1 text-sm text-text-muted">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required
                   class="w-full px-3 py-2 mb-4 bg-card border border-border rounded text-text text-base focus:outline-none focus:border-accent">
            <button type="submit"
                    class="w-full py-2.5 bg-danger text-white border-none rounded text-base cursor-pointer hover:bg-danger-hover transition-colors">
                Login
            </button>
        </form>
    </div>
</body>
</html>
