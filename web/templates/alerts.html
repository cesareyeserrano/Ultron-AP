{{define "content"}}
<div class="space-y-6">
    <h2 class="sr-only">Alerts</h2>
    <div id="alerts-feedback" class="hidden rounded-lg border border-danger/40 bg-danger/10 text-danger text-xs px-3 py-2" aria-live="polite"></div>
    <div class="flex flex-wrap items-center justify-between gap-2">
        <p class="text-sm text-text-muted">Active incidents and acknowledgment workflow.</p>
        <div class="flex flex-wrap items-center gap-2">
            {{if .Content.UnackCount}}
            <span class="text-xs bg-danger/20 text-danger px-2 py-1 rounded-full border border-danger/40">{{.Content.UnackCount}} unacknowledged</span>
            {{end}}
            <form
                hx-post="/api/alerts/clear"
                hx-target="#alerts-list"
                hx-swap="innerHTML"
                hx-indicator="#alerts-loading"
                hx-confirm="Clear alerts list?"
            >
                <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
                <input type="hidden" name="severity" value="{{.Content.SeverityFilter}}">
                <button type="submit" class="text-xs px-3 py-1.5 rounded-lg bg-surface border border-border text-text-muted hover:bg-danger/10 hover:text-danger transition-colors inline-flex items-center gap-1.5">
                    <svg id="alerts-loading" class="w-3.5 h-3.5 animate-spin htmx-indicator" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
                    </svg>
                    Clear Alerts
                </button>
            </form>
        </div>
    </div>

    <!-- Severity Filter -->
    <div class="panel-soft p-2 flex flex-wrap gap-2">
        <a href="/alerts" class="text-xs px-3 py-1.5 rounded-lg transition-colors
            {{if eq .Content.SeverityFilter ""}}bg-accent text-base{{else}}bg-surface text-text-muted hover:bg-card{{end}}" hx-boost="true">
            All
        </a>
        <a href="/alerts?severity=critical" class="text-xs px-3 py-1.5 rounded-lg transition-colors
            {{if eq .Content.SeverityFilter "critical"}}bg-danger text-white{{else}}bg-surface text-text-muted hover:bg-card{{end}}" hx-boost="true">
            Critical
        </a>
        <a href="/alerts?severity=warning" class="text-xs px-3 py-1.5 rounded-lg transition-colors
            {{if eq .Content.SeverityFilter "warning"}}bg-yellow-400 text-base{{else}}bg-surface text-text-muted hover:bg-card{{end}}" hx-boost="true">
            Warning
        </a>
        <a href="/alerts?severity=info" class="text-xs px-3 py-1.5 rounded-lg transition-colors
            {{if eq .Content.SeverityFilter "info"}}bg-accent text-base{{else}}bg-surface text-text-muted hover:bg-card{{end}}" hx-boost="true">
            Info
        </a>
    </div>

    <!-- Alerts List -->
    <div id="alerts-list">
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
        {{template "partials/alerts-list.html" dict "Alerts" .Content.Alerts "CSRFToken" .CSRFToken}}
    </div>
</div>
{{end}}
